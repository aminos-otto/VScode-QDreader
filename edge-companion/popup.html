<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
body{font:13px system-ui,sans-serif;width:310px;padding:12px;margin:0;color:#222}h1{font-size:15px;margin:0 0 8px}p{line-height:1.5}input{box-sizing:border-box;width:100%;padding:7px;margin:4px 0 10px}button{padding:8px 12px;background:#c72d29;border:0;color:#fff;border-radius:4px;cursor:pointer}#status{min-height:36px;white-space:pre-wrap}
</style></head><body><h1>起点页面传送</h1><p>在 VS Code 运行“起点阅读: 连接普通 Edge”，把配对码粘贴在这里。首次点“发送当前页面”完成配对。</p><input id="code" type="password" placeholder="端口:配对码" autocomplete="off"><button id="send">发送当前页面</button><p><label><input id="auto" type="checkbox" style="width:auto;margin:0 6px 0 0" checked>以后自动同步正常显示的起点页面</label></p><p id="status" role="status"></p><script src="popup.js"></script></body></html>
